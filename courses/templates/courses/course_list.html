{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">📚 All Courses</h2>

<a href="{% url 'course_create' %}" class="btn btn-primary mb-3">+ Add Course</a>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>#</th>
            <th>Title</th>
            <th>Instructor</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        {% for course in courses %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ course.title }}</td>
            <td>{{ course.instructor.username }}</td>
            <td>৳{{ course.price }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No courses yet.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
