{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="card p-4">
    <h3>{{ title }}</h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary mt-3">Save</button>
        <a href="{% url 'course_list' %}" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
{% endblock %}
