{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:450px; margin-top:60px;">
    <h3 class="text-center mb-3">Login to Truck Edu</h3>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary btn-block mt-3">Login</button>
    </form>
    <p class="text-center mt-3">No account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
