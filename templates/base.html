<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Truck Edu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .navbar-brand { font-weight: 700; }
        .card { border: none; box-shadow: 0 4px 20px rgba(0,0,0,.08); border-radius: 12px; }
        .table thead th { background: #343a40; color: #fff; }
        .btn-primary { background: #ff6b35; border: none; }
        .btn-primary:hover { background: #e85a28; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'course_list' %}">🚛 Truck Edu</a>
        <div class="ml-auto">
            {% if user.is_authenticated %}
                <span class="text-light mr-3">Hi, {{ user.username }}</span>
                <a href="{% url 'course_create' %}" class="btn btn-sm btn-primary">+ New Course</a>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-light">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Login</a>
                <a href="{% url 'register' %}" class="btn btn-sm btn-primary">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-info">{{ m }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
